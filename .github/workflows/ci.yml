name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Install Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.220

      - name: Import package
        run: uv run python -c "import saxo_bank_mcp"

      - name: Test
        run: scripts/run-pytest --junitxml=/tmp/saxo-ci-pytest-junit.xml

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run basedpyright

      - name: Codex plugin validate
        run: uv run --locked python scripts/validators/validate_plugin.py .

      - name: Claude plugin validate
        run: claude plugin validate --strict .

      - name: Skill quick validate saxo-auth-session
        run: uv run --locked python scripts/validators/quick_validate.py skills/saxo-auth-session

      - name: Skill quick validate saxo-analytics
        run: uv run --locked python scripts/validators/quick_validate.py skills/saxo-analytics

      - name: Skill quick validate saxo-bank
        run: uv run --locked python scripts/validators/quick_validate.py skills/saxo-bank

      - name: Skill quick validate saxo-openapi
        run: uv run --locked python scripts/validators/quick_validate.py skills/saxo-openapi

      - name: Skill quick validate saxo-qa-operations
        run: uv run --locked python scripts/validators/quick_validate.py skills/saxo-qa-operations

      - name: Skill quick validate saxo-reads
        run: uv run --locked python scripts/validators/quick_validate.py skills/saxo-reads

      - name: Skill quick validate saxo-safety-recovery
        run: uv run --locked python scripts/validators/quick_validate.py skills/saxo-safety-recovery

      - name: Skill quick validate saxo-streaming
        run: uv run --locked python scripts/validators/quick_validate.py skills/saxo-streaming

      - name: Skill quick validate saxo-trading
        run: uv run --locked python scripts/validators/quick_validate.py skills/saxo-trading

      - name: Dual-harness static gates
        run: uv run python scripts/run_agent_skill_static_gates.py --check

      - name: Generated catalog check
        run: uv run python scripts/generate_agent_skill_catalogs.py --check

      - name: Analytics dual packaging and version parity
        run: scripts/run-pytest tests/test_saxo_analytics_skill.py --junitxml=/tmp/saxo-ci-analytics-skill.xml

      - name: Analytics local dual fixture
        run: >-
          uv run python scripts/run_dual_harness_skill_evals.py
          --harness both --fixture analytics-research-to-precheck
          --out /tmp/saxo-ci-analytics-local-fixture.json

      - name: Eval manifest validation
        run: uv run python scripts/validate_agent_skill_evals.py --all

      - name: Version parity check
        run: uv run python scripts/run_agent_skill_static_gates.py --check version-parity

      - name: Wildcard permission scan
        run: uv run python scripts/run_agent_skill_static_gates.py --check wildcard

      - name: Official link check
        run: uv run python scripts/run_agent_skill_static_gates.py --check links

      - name: Portable skill frontmatter check
        run: uv run python scripts/run_agent_skill_static_gates.py --check frontmatter

      - name: Nested reference check
        run: uv run python scripts/run_agent_skill_static_gates.py --check nested-references

      - name: Cache-dangerous public file check
        run: uv run python scripts/run_agent_skill_static_gates.py --check cache-dangerous

      - name: QA gitignore secret probe
        run: uv run python -m saxo_bank_mcp.qa gitignore-secret --out .omo/evidence/saxo-bank-mcp/ci-gitignore-secret.json

      - name: QA health probe
        run: uv run python -m saxo_bank_mcp.qa health --out .omo/evidence/saxo-bank-mcp/ci-health.json

      - name: QA public secret scan
        run: >-
          uv run python -m saxo_bank_mcp.qa secret-scan
          --out /tmp/saxo-ci-secret-scan.json
          --paths
          README.md docs src tests pyproject.toml uv.lock .github .gitignore
          .mcp.json .agents .codex-plugin .claude-plugin skills scripts evals data/saxo

      - name: QA LIVE write refusal
        run: >-
          uv run python -m saxo_bank_mcp.qa live-write-refusal
          --out /tmp/saxo-ci-live-write-refusal.json

      - name: QA LIVE read refusal
        run: >-
          uv run python -m saxo_bank_mcp.qa live-read-refusal
          --out /tmp/saxo-ci-live-read-refusal.json
