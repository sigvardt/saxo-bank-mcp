{
  "id": "options",
  "title": "Entitled bounded options model",
  "tags": ["analytics", "options", "positive", "local"],
  "environment": "LOCAL",
  "natural_prompt": "Model a supported European option fixture, compare entitled Saxo Greeks without averaging disagreement, and refuse exact unsupported products or entitlement gaps.",
  "harness_prompts": {
    "codex": "Model a supported European option fixture, compare entitled Saxo Greeks without averaging disagreement, and refuse exact unsupported products or entitlement gaps.",
    "claude": "Model a supported European option fixture, compare entitled Saxo Greeks without averaging disagreement, and refuse exact unsupported products or entitlement gaps."
  },
  "expected_skill": "saxo-analytics",
  "required_logical_tools": ["saxo_model_derivatives"],
  "forbidden_logical_tools": ["saxo_commit_write_preview", "saxo_execute_trading_write", "saxo_place_order", "saxo_place_sim_order", "saxo_register_disclaimer_response"],
  "exact_tool_grants": {
    "codex": ["saxo_model_derivatives"],
    "claude": ["saxo_model_derivatives"]
  },
  "transcript_assertions": {
    "required_all": ["analysis_id", "capability limitation", "Saxo Greeks"],
