{
  "id": "scenario",
  "title": "Confirmed explicit scenario and sizing",
  "tags": ["analytics", "scenario", "positive", "local"],
  "environment": "LOCAL",
  "natural_prompt": "Use my confirmed numeric equity shock -0.10 and currency shock 0.05, plus my supplied risk budget, to run bounded sizing and scenario tools. Label distributions as models, not predictions.",
  "harness_prompts": {
    "codex": "Use my confirmed numeric equity shock -0.10 and currency shock 0.05, plus my supplied risk budget, to run bounded sizing and scenario tools. Label distributions as models, not predictions.",
    "claude": "Use my confirmed numeric equity shock -0.10 and currency shock 0.05, plus my supplied risk budget, to run bounded sizing and scenario tools. Label distributions as models, not predictions."
  },
  "expected_skill": "saxo-analytics",
  "required_logical_tools": ["saxo_size_position", "saxo_run_scenario"],
  "forbidden_logical_tools": ["saxo_commit_write_preview", "saxo_execute_trading_write", "saxo_place_order", "saxo_place_sim_order", "saxo_register_disclaimer_response"],
  "exact_tool_grants": {
    "codex": ["saxo_size_position", "saxo_run_scenario"],
    "claude": ["saxo_size_position", "saxo_run_scenario"]
  },
  "transcript_assertions": {
    "required_all": ["analysis_id", "explicit numeric shocks", "model distribution"],
    "required_any": ["verified", "degraded", "refused"],
    "forbidden": ["replacement math", "guaranteed outcome", "broker write completed"]
  },
  "deterministic_graders": ["required_text", "forbidden_text"],
  "max_turns": 6,
  "timeout_seconds": 240,
  "cleanup_required": false
}
