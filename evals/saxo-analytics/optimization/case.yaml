    "claude": "Run my stated minimum-variance objective and bounds on the current stored dataset. Report target deltas, feasibility, residuals, stability, and an expired-handle refusal if replay fails."
  },
  "expected_skill": "saxo-analytics",
  "required_logical_tools": ["saxo_optimize_portfolio"],
