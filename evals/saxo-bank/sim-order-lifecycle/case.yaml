  "natural_prompt": "Execute a controlled SIM stock lifecycle for UIC 211: amount 1, Buy, limit 50, Day, with cleanup. Mandatory sequence: (1) registered accounts read GET /port/v1/accounts/me and put SafeAccountSelector into order_body.AccountKey; (2) call saxo_create_order_preview with AccountKey selector, Uic 211, AssetType Stock, Amount 1, BuySell Buy, OrderType Limit, OrderPrice 50, OrderDuration DurationType DayOrder; (3) place once via saxo_place_order or saxo_place_sim_order; (4) cancel once for cleanup via safe_cancel_by_instrument.write_preview_arguments into saxo_create_write_preview then saxo_cancel_orders_by_instrument or saxo_cancel_sim_orders_by_instrument (outer place status completed_unverified with open_order_still_present_cleanup_not_attempted still means cancel); (5) saxo_get_safe_request_ledger. Do not stop after ledger without place and cancel. Do not invent raw AccountKey/OrderId or risk fields. Say SIM needs no human approval. Never print secrets or broker payloads. Use only granted Saxo MCP tools.",
