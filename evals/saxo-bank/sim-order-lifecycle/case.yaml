  "environment": "SIM",
  "natural_prompt": "Run a controlled SIM order lifecycle for stock UIC 211: amount 1, Buy, limit 50, Day. Discover SafeAccountSelector from a registered accounts read (GET /port/v1/accounts/me) and note account currency. Put that selector into order_body.AccountKey for saxo_create_order_preview (do not use raw AccountKey). Place once via saxo_place_order or saxo_place_sim_order. Read back open orders. If place returns safe_cancel_by_instrument, cancel exactly once by creating saxo_create_write_preview with operation_id=delete.trade.v2.orders, account_key=safe_account_selector, instrument_uic=211, quantity=1, estimated_notional=0, account_currency from the accounts read, risk with known cost/cash_required/margin_impact/contract_multiplier/conversion_known, and request_body AccountKey=safe_account_selector plus AssetType=Stock and Uic=211 (no raw OrderId). Then call saxo_cancel_orders_by_instrument or saxo_cancel_sim_orders_by_instrument once with that preview_token. If place is unknown/partial/unverified, reconcile via reads only and do not invent cleanup selectors. Confirm cleanup and check saxo_get_safe_request_ledger. SIM needs no human approval. Never print AccountKey, OrderId, tokens, or broker payloads. Use only granted Saxo MCP tools.",
