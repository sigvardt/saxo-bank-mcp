[project]
name = "saxo-bank-mcp"
version = "0.1.0"
description = "Saxo Bank OpenAPI MCP server with evidence-gated implementation loops."
requires-python = ">=3.12"
dependencies = [
  "anyio==4.14.1",
  "duckdb>=1.2.0,<2.0",
  "fastmcp==3.4.2",
  "httpx2[brotli,http2,zstd]==2.5.0",
  "matplotlib>=3.9.0,<4.0",
  "mcp==1.28.1",
  "numpy>=2.1.0,<3.0",
  "pydantic>=2.12.5",
  "plotly>=6.0.0,<7.0",
  "scipy>=1.14.0,<2.0",
  "websockets==16.0",
]

[project.scripts]
saxo-bank-mcp = "saxo_bank_mcp.__main__:main"
saxo-bank-live-login = "saxo_bank_mcp.live_login:main"
saxo-bank-sim-login = "saxo_bank_mcp.sim_login:main"
saxo-bank-live-precheck-proof = "saxo_bank_mcp.live_precheck_proof:main"
saxo-bank-live-session-keeper = "saxo_bank_mcp.live_session_keeper:main"
saxo-bank-sim-session-keeper = "saxo_bank_mcp.sim_session_keeper:main"
saxo-bank-bind-live-evidence = "saxo_bank_mcp.live_evidence_bundle:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saxo_bank_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data/analytics/metric_definitions.json" = "saxo_bank_mcp/_analytics_metric_definitions/metric_definitions.json"
"data/analytics/migrations" = "saxo_bank_mcp/_analytics_migrations"
"data/analytics/proof_profiles.json" = "saxo_bank_mcp/_analytics_proof_profiles/proof_profiles.json"
"data/analytics/production_release.json" = "saxo_bank_mcp/_analytics_production/production_release.json"
"data/analytics/source_contracts.json" = "saxo_bank_mcp/_analytics_source_contracts/source_contracts.json"
"data/analytics/vision_coverage_requirements.json" = "saxo_bank_mcp/_analytics_vision_requirements/vision_coverage_requirements.json"
"data/analytics/source_matrix_candidate.json" = "saxo_bank_mcp/_analytics_source_matrix/source_matrix_candidate.json"
"data/saxo/openapi_inventory.json" = "saxo_bank_mcp/_endpoint_registry/openapi_inventory.json"

[tool.hatch.build.targets.wheel.shared-scripts]
"scripts/saxo-bank-analytics-source-matrix" = "saxo-bank-analytics-source-matrix"
"scripts/saxo-bank-analytics-source-matrix-generate" = "saxo-bank-analytics-source-matrix-generate"

[dependency-groups]
dev = [
  "basedpyright>=1.34.0",
  "hatchling==1.32.0",
  "hypothesis>=6.0.0,<7.0",
  "pytest>=9.0.2",
  "ruff>=0.14.8",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/validators"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "EM101",
  "EM102",
  "INP001",
  "S603",
  "TC001",
  "TC002",
  "TC003",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.basedpyright]
include = ["src", "tests", "scripts/run_dual_harness_skill_evals.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
